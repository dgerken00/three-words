<!DOCTYPE html>
<!-- Two /describe/ clouds in one image, one above the other, for a results post that compares them.
     Drawn from the live answers, with the same colour, order, tilt and sizing rules as cloud-image.html.
     ?a=more-of&b=less-of&la=more%20of&lb=less%20of
       &q=<heading; {a} and {b} become the two labels>
     Render: Chrome headless --window-size=1200,1240 --screenshot=<out.png> "file://…/compare-clouds.html?…" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; width:1200px; height:1240px; overflow:hidden; background:#16141F; color:#C9C4D6;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .top { display:flex; justify-content:space-between; align-items:baseline; padding:30px 44px 0; }
  h1 { font-family:Georgia,serif; font-weight:300; font-size:38px; color:#F2EEE8; margin:0; white-space:nowrap; }
  h1 em { color:#F5C95D; font-style:italic; }
  .brand { font-family:Georgia,serif; font-size:22px; color:#8B8698; white-space:nowrap; }
  .brand b { color:#F5C95D; font-weight:400; }
  .panel { position:absolute; left:32px; right:32px; height:536px; }
  #pa { top:92px; } #pb { top:644px; }
  .label { display:flex; justify-content:space-between; align-items:baseline; padding:0 12px 8px; font-size:19px; color:#8B8698; }
  .label b { font-family:Georgia,serif; font-style:italic; font-weight:400; font-size:27px; color:#F5C95D; }
  .label span b { font-family:inherit; font-style:normal; font-weight:600; font-size:19px; color:#F2EEE8; }
  .box { height:492px; background:#110F17; border:1px solid #322E44; border-radius:24px; display:flex; overflow:hidden; }
  .cloud { flex:1; min-width:0; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; align-items:center;
    gap:3px 18px; padding:10px 20px; font-family:Georgia,serif; }
  .cloud span { display:inline-block; line-height:1.1; }
  .foot { position:absolute; left:44px; right:44px; bottom:16px; display:flex; justify-content:space-between; font-size:19px; color:#8B8698; }
</style>
</head>
<body>
<div class="top"><h1 id="h1"></h1><div class="brand">✳ three<b>·</b>words</div></div>
<div class="panel" id="pa"><div class="label"><b id="la"></b><span id="ca"></span></div><div class="box"><div class="cloud" id="ka"></div></div></div>
<div class="panel" id="pb"><div class="label"><b id="lb"></b><span id="cb"></span></div><div class="box"><div class="cloud" id="kb"></div></div></div>
<div class="foot"><span id="when"></span><span id="where"></span></div>
<script>
(async () => {
  const SUPABASE_URL = 'https://iyphfzubdebuenbiplzy.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5cGhmenViZGVidWVuYmlwbHp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5NDI5NDMsImV4cCI6MjA5ODUxODk0M30.sPUWJJ3-oyjQRTVpGBWBAPnPBG47Ojndu8MC2Ej4FdQ';
  const p = new URLSearchParams(location.search);
  const clean = (s) => String(s).toLowerCase().replace(/[^a-z0-9-]/g, '');
  const a = clean(p.get('a') || 'more-of'), b = clean(p.get('b') || 'less-of');
  const fetchCloud = async (slug) => (await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_topic_cloud`, {
    method: 'POST', body: JSON.stringify({ p_slug: slug, p_limit: 1000 }),
    headers: { apikey: ANON_KEY, authorization: 'Bearer ' + ANON_KEY, 'content-type': 'application/json' },
  })).json();
  const [A, B] = await Promise.all([fetchCloud(a), fetchCloud(b)]);

  const PALETTE = ['#F5C95D', '#E88C9C', '#8FB8C9', '#C9A6E8', '#A8D8B0'];
  const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
  const mix = (s) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
    return h >>> 0;
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function drawCloud(el, data) {
    const words = data.words || [];
    const max = words.reduce((m, x) => Math.max(m, x.c), 1);
    const placed = words.slice().sort((x, y) => mix(x.w) - mix(y.w));
    const draw = (biggest, floor) => {
      let last = -1;
      el.innerHTML = placed.map((x) => {
        const t = max === 1 ? 0.4 : (x.c - 1) / (max - 1);
        const size = Math.round(floor + t * (biggest - floor));
        let ci = hash(x.w) % PALETTE.length;
        if (ci === last) ci = (ci + 1 + (hash(x.w) % (PALETTE.length - 1))) % PALETTE.length;
        last = ci;
        const tilt = ((hash(x.w) % 7) - 3) * 1.2;
        return `<span style="font-size:${size}px;color:${PALETTE[ci]};font-weight:${t > 0.55 ? 600 : 400};transform:rotate(${tilt}deg)">${esc(x.w)}</span>`;
      }).join('');
    };
    let floor = 44;
    for (;;) {
      draw(Math.min(96, floor * 3.2), floor);
      if (el.scrollHeight <= el.clientHeight || floor <= 13) break;
      floor -= 0.5;
    }
  }
  drawCloud(document.getElementById('ka'), A);
  drawCloud(document.getElementById('kb'), B);

  const la = p.get('la') || 'more of', lb = p.get('lb') || 'less of';
  document.getElementById('h1').innerHTML = esc(p.get('q') || 'What do you want {a} and {b} right now?')
    .replace('{a}', `<em>${esc(la)}</em>`).replace('{b}', `<em>${esc(lb)}</em>`);
  document.getElementById('la').textContent = la;
  document.getElementById('lb').textContent = lb;
  const count = (d) => `<b>${(Number(d.total) || 0).toLocaleString()}</b> answers · ${(Number(d.distinct_words) || 0).toLocaleString()} different words`;
  document.getElementById('ca').innerHTML = count(A);
  document.getElementById('cb').innerHTML = count(B);
  document.getElementById('when').textContent =
    `Open online survey, as of ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
  document.getElementById('where').textContent = `Add yours: threewordsapp.com/describe/${b}`;
  document.title = 'ready';
})();
</script>
</body>
</html>
