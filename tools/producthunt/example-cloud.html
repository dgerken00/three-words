<!DOCTYPE html>
<!-- Product Hunt gallery: an EXAMPLE cloud about a person, to show the "about you" use.
     Same look as tools/cloud-image.html, at 1270x760, but the name, words and count are made up,
     so the image says "Example" twice. Never present it as a real cloud.
     Render: Chrome headless --window-size=1270,760 --screenshot=store-assets/producthunt/cloud-example-you.png
     The top words match the landing page's example (kind, funny, loyal, warm). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; width:1270px; height:760px; overflow:hidden; background:#16141F; color:#C9C4D6;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .top { display:flex; align-items:baseline; gap:18px; padding:30px 44px 0; }
  h1 { font-family:Georgia,serif; font-weight:300; font-size:40px; color:#F2EEE8; margin:0; white-space:nowrap; }
  h1 em { color:#F5C95D; font-style:italic; }
  .tag { align-self:center; font-size:15px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:#F5C95D;
    border:1.5px solid #F5C95D; border-radius:999px; padding:5px 14px 4px; }
  .brand { margin-left:auto; font-family:Georgia,serif; font-size:22px; color:#8B8698; white-space:nowrap; }
  .brand b { color:#F5C95D; font-weight:400; }
  .box { position:absolute; left:32px; right:32px; top:100px; bottom:66px; background:#110F17; border:1px solid #322E44;
    border-radius:24px; display:flex; overflow:hidden; }
  #cloud { flex:1; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; align-items:center;
    gap:4px 20px; padding:10px 20px; font-family:Georgia,serif; }
  #cloud span { display:inline-block; line-height:1.1; }
  .foot { position:absolute; left:44px; right:44px; bottom:20px; display:flex; justify-content:space-between;
    font-size:19px; color:#8B8698; }
  .foot b { color:#F2EEE8; font-weight:600; }
</style>
</head>
<body>
<div class="top"><h1>Describe <em>Sam</em> in three words</h1><span class="tag">Example</span><div class="brand">✳ three<b>·</b>words</div></div>
<div class="box"><div id="cloud"></div></div>
<div class="foot"><span><b>Example:</b> a cloud about a person, after 31 friends and family answered</span><span>Start yours in the three·words app</span></div>
<script>
// 31 people x 3 words = 93. Made up.
const WORDS = [["kind", 10], ["funny", 8], ["loyal", 6], ["warm", 5], ["thoughtful", 5], ["curious", 4], ["stubborn", 4],
  ["generous", 3], ["witty", 3], ["driven", 3], ["honest", 3], ["patient", 2], ["calm", 2], ["creative", 2], ["reliable", 2],
  ["brave", 2], ["sarcastic", 2], ["adventurous", 2], ["playful", 2], ["caring", 2], ["smart", 2], ["wise", 1], ["gentle", 1],
  ["sincere", 1], ["goofy", 1], ["energetic", 1], ["organized", 1], ["chaotic", 1], ["fierce", 1], ["optimistic", 1],
  ["quirky", 1], ["humble", 1], ["determined", 1], ["genuine", 1], ["cheerful", 1], ["loving", 1], ["steady", 1],
  ["clever", 1], ["bold", 1], ["resilient", 1]];

// Same colour, order, tilt and sizing rules as tools/cloud-image.html.
const PALETTE = ['#F5C95D', '#E88C9C', '#8FB8C9', '#C9A6E8', '#A8D8B0'];
const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
const mix = (s) => {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
};
const max = WORDS.reduce((m, [, c]) => Math.max(m, c), 1);
const placed = WORDS.slice().sort((a, b) => mix(a[0]) - mix(b[0]));
const cloud = document.getElementById('cloud');
const draw = (biggest, floor) => {
  let last = -1;
  cloud.innerHTML = placed.map(([w, c]) => {
    const t = (c - 1) / (max - 1);
    const size = Math.round(floor + t * (biggest - floor));
    let ci = hash(w) % PALETTE.length;
    if (ci === last) ci = (ci + 1 + (hash(w) % (PALETTE.length - 1))) % PALETTE.length;
    last = ci;
    const tilt = ((hash(w) % 7) - 3) * 1.2;
    return `<span style="font-size:${size}px;color:${PALETTE[ci]};font-weight:${t > 0.55 ? 600 : 400};transform:rotate(${tilt}deg)">${w}</span>`;
  }).join('');
};
let floor = 44;
for (;;) {
  draw(Math.min(112, floor * 3), floor);
  if (cloud.scrollHeight <= cloud.clientHeight || floor <= 14) break;
  floor -= 0.5;
}
</script>
</body>
</html>
